[package]
name = "orca-cli"
version = "0.1.0"
edition = "2021"
description = "O.R.C.A. - Optimize, Refine, Carry out, Assess: AI-powered task processor"
license = "MIT"
repository = "https://github.com/NanoCoder1007/orca/"
readme = "README.md"
keywords = ["cli", "ai", "agent", "automation", "rust"]
categories = ["command-line-utilities"]

[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
colored = "3.1.1"
anyhow = "1.0"
regex = "1.10"
dirs = "6.0.0"
libc = "1.0.0-alpha.3"